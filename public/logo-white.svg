<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 54" fill="none" width="240" height="54">
  <!-- Logo Mark / Emblem - 100% Pure White for Dark Backgrounds -->
  <g transform="translate(2, 4)">
    <!-- Squircle Container -->
    <rect width="46" height="46" rx="12" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1.8" />

    <!-- Notebook Ruled Lines (Pure White) -->
    <line x1="8" y1="14" x2="38" y2="14" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="8" y1="23" x2="38" y2="23" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="8" y1="32" x2="38" y2="32" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Book Spine / Silhouette -->
    <path d="M11 37V12a2 2 0 0 1 2-2h20a2 2 0 0 1 2 2v25a1 1 0 0 1-1 1H12a1 1 0 0 1-1-1Z" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" fill="none" />

    <!-- Code Brackets < / > (Pure White) -->
    <path d="M16 19l-3 4.5 3 4.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M30 19l3 4.5-3 4.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Fountain Pen Nib / Stylus flourish (Pure White) -->
    <path d="M23 16v12" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 2.5" />
    <circle cx="23" cy="30" r="1.5" fill="#ffffff" />
  </g>

  <!-- Typography / Brand Name - 100% Pure White -->
  <g transform="translate(58, 31)">
    <text font-family="'Nunito', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.8">Py<tspan fill="#ffffff">Notes</tspan></text>
    <!-- Accent Dot (Pure White) -->
    <circle cx="118" cy="-6" r="3" fill="#ffffff" />
  </g>

  <!-- Subtitle: Handwritten Coding Notes - Pure White with high legibility -->
  <g transform="translate(60, 44)">
    <text font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="8.5" fill="#ffffff" fill-opacity="0.85" letter-spacing="1.2">HANDWRITTEN CODING NOTES</text>
  </g>
</svg>
